[env:smalltv_pro]
; PINNED to the pioarduino community platform release 55.03.311: arduino-esp32 3.3.11 +
; ESP-IDF v5.5.5 (deliberate upgrade, 2026-08-04, branch idf-upgrade). The official
; platformio/espressif32 platform ships no Arduino core past 2.0.17 / IDF v4.4.7 - core 3.x
; exists only through this fork, which is what the whole ESP32 Arduino community builds on.
;
; History that still matters: this project sat on espressif32 6.6.0 (2.0.14 / IDF v4.4.6)
; because a POINT difference in WiFi/lwIP/mbedTLS shifts heap layout, and on 6.4.0 TLS did
; not work at all. The same caution applies tenfold across a major IDF jump: anything
; touching TLS, heap headroom, touch calibration or the backlight PWM must be re-verified
; on hardware, not assumed. Do not float this pin - move it deliberately or not at all.
;
; Core 3.x finally has WiFiClientSecure::setBufferSizes(), relevant to the Stock TLS work.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB

; Regenerates the asset headers and assembles data/ before every build. Each step is a
; no-op once satisfied: the asset pipeline is skipped unless scripts/assets.toml is newer
; than its outputs (a full render is over a minute), the stock capture is cached, and the
; pack only rewrites files whose content changed.
;
; A COLD CHECKOUT NEEDS A FACTORY UNIT ONCE. A few filesystem files cannot be generated, so
; the first build captures them from a device running the factory firmware, into
; assets/cache/stock/. Supply that device's address as a build parameter -- the hook does
; not prompt, because prompting from inside a PlatformIO build does not work (the reason is
; recorded in scripts/prebuild.py):
;
;   $env:SMOLTV_STOCK_HOST='<ip>'; pio run -t buildfs      (powershell)
;   SMOLTV_STOCK_HOST=<ip> pio run -t buildfs              (bash)
;
; or uncomment the line below to persist it. It is deliberately left commented: the address
; is specific to whoever is building, not to the project.
;custom_stock_host = <ip>
;
; SMOLTV_SKIP_PREBUILD=1 bypasses the hook entirely.
extra_scripts = pre:scripts/prebuild.py

build_flags =
    -std=gnu++17
    ; async_tcp service task: stack 16384, priority 3, no core affinity.
    ; NEVER HALVE THIS. The stack was once cut to 8192 as a workaround for a
    ; blk8-fragmentation/TLS-starvation theory - the real cause was the framework version
    ; pinned above. 8 KB OVERFLOWS under concurrent file serving (the /#image GIF grid): the
    ; async_tcp task corrupted its stack and the Task WDT rebooted the device, with the
    ; backtrace printing "<-CORRUPTED".
    ; Silence ARDUHAL logging. The only thing it emits for us is a vfs_api ESP_LOGE on
    ; every failed LittleFS.open(), and a MISSING config file is the NORMAL state: none are
    ; shipped, and one is created only when the user saves that app's settings.
    ; Note esp_log_level_set() does NOT suppress these: they come from ARDUHAL's log_e,
    ; not ESP-IDF's tag-based logger. Our own diagnostics use Serial.printf and are
    ; unaffected. Without this the boot log is flooded, which is what drove us to pre-seed
    ; /.sys and thereby let seeded values override the in-code defaults.
    -DCORE_DEBUG_LEVEL=0
    ; TFT_eSPI pin config - verified against ESPHome SmallTV Pro config
    ; NOTE: CS not defined in ESPHome (may be tied to GND on PCB); set -1 if SPI is dedicated.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=-1
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=25
    -DTFT_BACKLIGHT_ON=LOW
    ; No TOUCH_CS: this board has no SPI touch controller at all - touch is the ESP32's own
    ; capacitive pad (Touch.h, touchRead()), unrelated to TFT_eSPI's touch extension. Defining
    ; TOUCH_CS would be wrong, not just unused, so silence the library's own warning instead.
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; LVGL v8. Our own lv_conf.h sits in include/.
    ; LV_CONF_INCLUDE_SIMPLE makes LVGL do #include "lv_conf.h", so the file must be
    ; on the include path of the LIBRARY build too, not just ours. PlatformIO adds
    ; include/ globally (project src/ is NOT visible to lib builds), so lv_conf.h
    ; lives there. Without this LVGL silently compiles with its own defaults and
    ; every derived value in lv_conf.h is ignored.
    -DLV_CONF_INCLUDE_SIMPLE=1
    ; ...and put include/ on the path EXPLICITLY. PlatformIO does not reliably
    ; propagate include/ into library builds, so without this LVGL still misses
    ; lv_conf.h and falls back to its own defaults (it only warns via #pragma
    ; message, so the build still succeeds and every derived value is silently lost).
    -I include
    ; 60 MHz, PROVEN: display_boot_task brings the panel up via
    ; TFT_eSPI_initDMA at 60 MHz. Ours was 27 MHz, which more than doubles every
    ; band flush and is a prime suspect for the tearing and the responsiveness gap.
    -DSPI_FREQUENCY=60000000
    -DSPI_READ_FREQUENCY=6000000

; EXACT pins, deliberately. The caret ranges floated when the platform switch wiped
; .pio/libdeps, stacking four library changes on top of the core upgrade. A library moves
; when we move it, one at a time, verified on the panel.
; TFT_eSPI is the exception to "keep the old version": 2.5.31 does not COMPILE on core 3
; (GPIO register struct not in scope on IDF 5), so 2.5.43 is the floor there.
lib_deps =
    lvgl/lvgl @ 8.3.11
    bodmer/TFT_eSPI @ 2.5.43
    bodmer/TJpg_Decoder @ 1.0.8
    bblanchon/ArduinoJson @ 6.21.3
    bitbank2/AnimatedGIF @ 1.4.7

monitor_speed = 115200
; upload_port / monitor_port are left unset so PlatformIO autodetects the adapter. Set them
; if you have more than one and it picks the wrong one:
;   upload_port = COM5
;   monitor_port = COM5

; LittleFS data partition for web assets and config
board_build.filesystem = littlefs

; LVGL smoke test. Same firmware, plus -DLVGL_SMOKE=1, which takes over the display
; immediately after Display::begin() and never returns. Used to prove lv_conf.h is in
; force, the static 240x80 buffer and the DMA flush work on hardware, and colours are
; not double-swapped -- before any screen is built on top.
;   pio run -e smoke -t upload
[env:smoke]
extends = env:smalltv_pro
build_flags = ${env:smalltv_pro.build_flags} -DLVGL_SMOKE=1 -DLVGL_SMOKE_LAUNCHER=1

; Spotpear ESP32-S3 1.54" LCD N16R8 AI Chat Box (sp-esp32-s3-1.54-muma / EN-V5 with-B-T)
; Hardware: ESP32-S3R8 (16MB Flash, 8MB Octal PSRAM), ST7789 240x240 LCD,
; CST816D I2C Touchscreen + GPIO0 Boot Button, ES8311 I2C/I2S Audio Codec + PA (GPIO46).
[env:xiaozhi_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
extra_scripts = pre:scripts/prebuild.py
lib_deps = ${env:smalltv_pro.lib_deps}
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_SPOTPEAR_MUMA_S3=1
    -DBOARD_HAS_PSRAM
    -DPOWER_LATCH_PIN=3
    -DHAS_I2S_AUDIO=1
    -DI2S_SPK_MCLK=16
    -DI2S_SPK_BCLK=9
    -DI2S_SPK_LRCK=45
    -DI2S_SPK_DOUT=8
    -DAUDIO_PA_PIN=46
    -DAUDIO_I2C_SDA=15
    -DAUDIO_I2C_SCL=14
    -DUSE_DIGITAL_BUTTON=1
    -DPIN_BUTTON=0
    -DHAS_CST816_TOUCH=1
    -DTP_SDA_PIN=11
    -DTP_SCL_PIN=7
    -DTP_RST_PIN=6
    -DTP_INT_PIN=12
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=2
    -DTFT_SCLK=4
    -DTFT_CS=5
    -DTFT_DC=47
    -DTFT_RST=38
    -DTFT_BL=42
    -DTFT_BACKLIGHT_ON=LOW
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I include
    -DSPI_FREQUENCY=60000000
    -DSPI_READ_FREQUENCY=6000000
