[fonts.WDAY25]
# Letters and space only -- deliberately narrow, since nothing else is ever rendered here.
# This face draws exactly one thing: the weekday abbreviation ("Sun".."Sat") on the clock
# screen. The punctuation carried the TALLEST glyphs in the range -- "(" and ")" reach
# 24px where the letters reach 16 -- and --plan sizes a face so its tallest glyph fits the
# line box, so a parenthesis that is never drawn was shrinking the visible letters by a
# fifth. Dropping them lets the letters fill the box, and saves about 30 KB of flash.
