# -- Table orderings ------------------------------------------------------------------
# These orders are behaviour, not appearance, and none of them can be derived from the
# entries above -- so they live here rather than being hidden inside the generator.
[icos.FAVICON]
out          = "favicon.ico"
target_dir   = "/"                    # LittleFS root, served by the static file handler
set          = "twemoji"              # see ICO_SRC in build_assets.py
icon         = "1f9e0"                # U+1F9E0 BRAIN
licence      = "CC-BY-4.0"
size         = 32                     # a single 32x32 image, see render_icos()

[order]
# Launcher order: the sequence the apps are registered in, which is the order the launcher
# scrolls through them. NOT the alphabetical order the [images] entries happen to be in.
app_icons = ["APP_BITCOIN", "APP_COINGECKO", "APP_STOCK", "APP_WEATHER", "APP_PICTURE",
             "APP_MONITOR", "APP_CLOCK", "APP_IDEA", "APP_SETTINGS"]

# Weather condition codes, scanned in lock-step with the WX_ICON_* descriptors.
wx_codes = [1, 2, 3, 4, 9, 10, 11, 13, 50]

# Coin lookup. Trading symbols are matched by PREFIX ("BTCUSDT" -> BTC); ids are matched
# EXACTLY, because a prefix match would send "bitcoin-cash" to the BTC icon.
coin_order = ["BTC", "ETH", "BNB", "DOGE", "XRP", "LINK", "ADA", "TRX", "SOL", "SUI", "LTC", "BCH"]
coin_ids = ["bitcoin", "ethereum", "binancecoin", "dogecoin", "ripple", "chainlink",
            "cardano", "tron", "solana", "sui", "litecoin", "bitcoin-cash"]

# -- Animated GIFs (LittleFS content, not compiled into the firmware) -----------------
# These are device DATA: the pipeline renders them to assets/build/gifs/ and they are
# uploaded to /image/80x80.gif/ on the device. They are not part of the generated headers.
[gifs.EARTH]
out          = "earth.gif"
target_dir   = "/image/80x80.gif"     # the weather app's GIF directory
source       = "nasa-land-ocean-ice"  # see GIF_TEXTURE_SRC in build_assets.py
licence      = "PD-NASA"
width        = 80
height       = 80
radius       = 38                     # globe radius in px, leaves a small margin
frames       = 240
duration_ms  = 40                     # 40ms = 25 fps, matching the stock space.gif
supersample  = 3                      # render at 3x then downscale
# Colours. BLACK MUST BE FIRST: a GIF decoder fills background/disposed regions with
# palette index 0, and the firmware additionally composites black as transparent. With a
# non-black entry 0 the panel showed a flashing CYAN SQUARE behind the globe.
palette      = [[0, 0, 0], [0, 235, 255], [0, 28, 52]]   # transparent, land, ocean
