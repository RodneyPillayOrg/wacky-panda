# SmolTV-Pro asset manifest - target specs for the font and icon pipeline.
#
# Every face and image the firmware draws, with the freely licensed source it is
# generated from. This file is a FROZEN FIXED POINT: edit it by hand rather than
# regenerating it, so a bad build can never rewrite its own spec.
#
# CLOCK62 and TIME76 carry an explicit 'size' instead of letting --plan resolve one.
# --plan picks the largest size that FITS, which is not the same as the size that
# LOOKS right: unpinned, TIME76 resolves to 109px and reads too large for the clock
# screen. These two values are the ones that were shipping and looked correct.
# Revisit them together with the typeface choice, not separately -- squareness and
# height trade against each other here because CLOCK62's digits sit at fixed 35px
# positions, so a wider face has to shrink to avoid overlapping.
#
# 'weight' is the variable-font axis instance to render at. It MUST be set: the upstream
# variable fonts default to their thinnest axis value, so omitting it silently produces a
# hairline face. These values approximate the weight of the faces they stand in for; they
# are an appearance choice and safe to tune.
#
# Faces with source = "lvgl-builtin" are NOT fetched or rendered by the pipeline. LVGL
# already ships them (enabled in include/lv_conf.h), so the generated header aliases the
# symbol straight to the library's font and the pipeline skips the row entirely. Do not
# 'fix' these by giving them a size: rendering them ourselves would add ~153 KB of flash
# to reproduce tables the binary already contains.
#
# line_height and base_line MUST be preserved exactly - src/ hardcodes panel sizes
# and layout thresholds against them. 'size' is the px size handed to lv_font_conv
# and is resolved by the pipeline's --plan stage.

