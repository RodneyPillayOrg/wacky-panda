[fonts.CLOCK62]
# Drawn as five separate labels pinned to fixed x positions 35px apart, so what limits the
# size here is DIGIT WIDTH, not line height. Specifically the INK width: the labels are
# transparent, so two glyphs collide only when the ink itself is wider than the pitch (the
# per-glyph ofs_x cancels out of that comparison). Measuring the ADVANCE instead counts both
# sidebearings and needlessly rejects fonts that would sit side by side fine.
max_ink_width = 35
symbol       = "FONT_CLOCK62"
