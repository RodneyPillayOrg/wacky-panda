[images.WX_GAUGE_TEMP]
# This source pads its glyph heavily: rendered straight, the mark occupies well under
# a fifth of its box and is effectively invisible on the panel. 'trim' crops to the
# ink and scales it to fill the slot, which is what this space needs -- note the ink's
# aspect ratio already matches the slot's almost exactly.
#
# Baked at its FINAL on-screen size (17x32) -- no runtime lv_img_set_zoom. This used to be
# a 21x40 slot rendered at zoom 0xB4 (70.3%) on the temp gauge, then bumped to a one-off 80%
# zoom because the thermometer read too small; that left the icon's zoom pivot (always the
# center of the UNSCALED box) fixed while the box grew, which is what put the rendered icon
# visibly right of the humidity icon's midpoint. Baking the target size in and aligning by
# plain LVGL offsets (no zoom math) is what makes the two icons center-alignable at all.
trim         = true
symbol       = "IMG_WX_GAUGE_TEMP"
set          = "basmilius"
icon         = "thermometer"
licence      = "MIT"
width        = 17
height       = 32
cf           = "LV_IMG_CF_TRUE_COLOR"
data_size    = 1088          # width * height * 2 bytes (TRUE_COLOR, RGB565)

[images.WX_GAUGE_HUMI]
